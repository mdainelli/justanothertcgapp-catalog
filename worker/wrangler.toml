name = "justanothertcgapp-proposals"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

# Privacy: no request/payload/IP logging. Observability (logs, traces) stays OFF.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# eBay search: 10 searches per minute per install (Workers Rate Limiting, free, needs no id).
[[ratelimits]]
name = "EBAY_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# eBay production App ID (Client ID): public, so it lives here and not in the secrets.
EBAY_CLIENT_ID = "MarcoDai-analisi-PRD-a814323b9-9594f752"

# Subscription check on /ebay/search. "false" = off (open, current behaviour). Set "true" only at release.
SUBSCRIPTION_CHECK_ENABLED = "false"
# Supabase project (public values) used only to let an admin account bypass the check.
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""

# Secrets (NOT here, set with `npx wrangler secret put <NAME>`):
#   EBAY_CLIENT_SECRET, EBAY_VERIFICATION_TOKEN  optional, eBay alerts (see README)
#   GOOGLE_PLAY_SERVICE_ACCOUNT          service account JSON, needed when SUBSCRIPTION_CHECK_ENABLED = "true"
