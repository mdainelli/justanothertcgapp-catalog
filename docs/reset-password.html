<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuova password</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1E1B3A; color: #F1EEFF; margin: 0; padding: 24px; }
  main { max-width: 360px; margin: 10vh auto; }
  input, button { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin-top: 12px; border-radius: 16px; border: 1px solid #4A4478; }
  input { background: #24204A; color: #F1EEFF; }
  button { background: #FFD23F; color: #1E1B3A; font-weight: 800; border: 0; }
  p { color: #C9C3EE; }
</style>
</head>
<body>
<main>
  <h1>Scegli una nuova password</h1>
  <form id="f">
    <input id="pw" type="password" minlength="8" placeholder="Nuova password (almeno 8 caratteri)" required>
    <button>Salva</button>
  </form>
  <p id="msg"></p>
</main>
<script>
  // TODO (owner): replace the two placeholders below with the Supabase project URL and the anon key
  // (Project Settings > API). The anon key is public by design. Do not use the service_role key.
  var SUPABASE_URL = "https://hxaqclfpwvttpwdbsidr.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YXFjbGZwd3Z0dHB3ZGJzaWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0Njg5MzEsImV4cCI6MjExMTA0NDkzMX0.EV8awu2OIGdKOdL-PWvwoult-ScEmbYQA85kide1w6g";
  var token = new URLSearchParams(location.hash.slice(1)).get("access_token");
  var msg = document.getElementById("msg");
  if (!token) { msg.textContent = "Link non valido o scaduto: chiedi un nuovo reset dall'app."; document.getElementById("f").hidden = true; }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + token },
      body: JSON.stringify({ password: document.getElementById("pw").value })
    }).then(function (r) {
      msg.textContent = r.ok ? "Fatto. Torna nell'app e accedi con la nuova password." : "Non e' stato possibile salvare la password. Riprova con un nuovo link.";
    }).catch(function () { msg.textContent = "Nessuna connessione."; });
  });
</script>
</body>
</html>
