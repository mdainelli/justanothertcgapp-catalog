<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustAnotherTCGApp</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1E1B3A; color: #F1EEFF; margin: 0; padding: 24px; }
  main { max-width: 360px; margin: 10vh auto; }
  input, button { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin-top: 12px; border-radius: 16px; border: 1px solid #4A4478; }
  input { background: #24204A; color: #F1EEFF; }
  button { background: #FFD23F; color: #1E1B3A; font-weight: 800; border: 0; }
  p { color: #C9C3EE; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <form id="f" hidden>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <button id="save"></button>
  </form>
  <p id="msg"></p>
</main>
<script>
  // Imposta qui i valori del tuo progetto (la chiave anon e' pubblica).
  var SUPABASE_URL = "https://hxaqclfpwvttpwdbsidr.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YXFjbGZwd3Z0dHB3ZGJzaWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0Njg5MzEsImV4cCI6MjExMTA0NDkzMX0.EV8awu2OIGdKOdL-PWvwoult-ScEmbYQA85kide1w6g";

  // One page for every link Supabase sends (its "Site URL"):
  // - email confirmation after sign-up (type=signup / email_change / invite): only says the email is confirmed.
  //   It never asks for a password: the account already has the one chosen in the app.
  // - password reset (type=recovery): the form for the new password.
  // - expired or already used links (#error=...): says so.
  var it = (navigator.language || "it").toLowerCase().indexOf("it") === 0;
  var T = it ? {
    confirmedTitle: "Email confermata",
    confirmed: "Il tuo account è attivo. Torna nell'app e accedi con l'email e la password che hai scelto.",
    resetTitle: "Scegli una nuova password",
    placeholder: "Nuova password (almeno 8 caratteri)",
    save: "Salva",
    saved: "Fatto. Torna nell'app e accedi con la nuova password.",
    same: "È la password che hai già: puoi usarla subito per accedere nell'app. Se vuoi cambiarla, scrivine una diversa.",
    weak: "Password troppo debole: usane una più lunga o meno comune.",
    failed: "Non è stato possibile salvare la password. Chiedi un nuovo link dall'app.",
    expiredTitle: "Link scaduto",
    expired: "Questo link è scaduto o è già stato usato. Se stavi confermando l'email, prova ad accedere nell'app: potrebbe essere già confermata. Per la password, chiedi un nuovo link dall'app.",
    invalidTitle: "Link non valido",
    invalid: "Apri il link più recente che hai ricevuto per email, oppure chiedine uno nuovo dall'app.",
    offline: "Nessuna connessione."
  } : {
    confirmedTitle: "Email confirmed",
    confirmed: "Your account is active. Go back to the app and sign in with the email and password you chose.",
    resetTitle: "Choose a new password",
    placeholder: "New password (at least 8 characters)",
    save: "Save",
    saved: "Done. Go back to the app and sign in with the new password.",
    same: "That is already your password: you can sign in with it in the app right away. To change it, type a different one.",
    weak: "Password too weak: use a longer or less common one.",
    failed: "The password could not be saved. Ask for a new link from the app.",
    expiredTitle: "Link expired",
    expired: "This link has expired or was already used. If you were confirming your email, try signing in in the app: it may already be confirmed. For the password, ask for a new link from the app.",
    invalidTitle: "Invalid link",
    invalid: "Open the latest link you received by email, or ask for a new one from the app.",
    offline: "No connection."
  };
  if (!it) document.documentElement.lang = "en";

  var params = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var form = document.getElementById("f");
  var token = params.get("access_token");
  var type = params.get("type") || query.get("type");
  var error = params.get("error") || query.get("error") || params.get("error_code") || query.get("error_code");

  function show(t, m) { title.textContent = t; msg.textContent = m; }

  if (error) {
    show(T.expiredTitle, T.expired);
  } else if (token && type === "recovery") {
    title.textContent = T.resetTitle;
    document.getElementById("pw").placeholder = T.placeholder;
    document.getElementById("save").textContent = T.save;
    form.hidden = false;
  } else if (token || type === "signup" || type === "email" || type === "email_change" || type === "invite") {
    show(T.confirmedTitle, T.confirmed);
  } else {
    show(T.invalidTitle, T.invalid);
  }
  // the tokens are not needed in the address bar (or in the history) any more
  if (location.hash) history.replaceState(null, "", location.pathname);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    msg.textContent = "";
    fetch(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + token },
      body: JSON.stringify({ password: document.getElementById("pw").value })
    }).then(function (r) {
      if (r.ok) { form.hidden = true; msg.textContent = T.saved; return; }
      return r.json().catch(function () { return {}; }).then(function (b) {
        var code = (b && (b.error_code || b.code)) || "";
        if (code === "same_password") msg.textContent = T.same;
        else if (code === "weak_password") msg.textContent = T.weak;
        else msg.textContent = T.failed;
      });
    }).catch(function () { msg.textContent = T.offline; });
  });
</script>
</body>
</html>
