name: Worker deploy

# Publishes the eBay Worker on Cloudflare (free plan). Run it by hand from Actions > Worker deploy.
# Needs (Settings > Secrets and variables > Actions):
#   secrets   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#             CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
# Optional, for the eBay alerts (/ebay/search and /ebay/account-deletion); each one is set on the Worker only when non-empty:
#   (EBAY_CLIENT_ID, the public App ID, is in worker/wrangler.toml [vars])
#   secrets   EBAY_CLIENT_SECRET       eBay production keyset Cert ID
#             EBAY_VERIFICATION_TOKEN  32-80 chars [A-Za-z0-9_-], same value entered in the eBay developer portal
# Optional, subscription check on /ebay/search (only used when SUBSCRIPTION_CHECK_ENABLED = "true" in worker/wrangler.toml):
#   secrets   GOOGLE_PLAY_SERVICE_ACCOUNT  full JSON key of the Google Cloud service account linked in Play Console
# The KV namespace is created on the first run and reused afterwards. Secrets are never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: justanothertcgapp-proposals-LIMITS
    steps:
      - name: Check configuration
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing secret:$name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration:$missing (see worker/README.md)"
            exit 1
          fi

      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Find or create the KV namespace
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id' | head -n1; }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler kv namespace create "$KV_TITLE" > /dev/null
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the KV namespace"; exit 1; fi
          echo "KV_ID=$id" >> "$GITHUB_ENV"

      - name: Fill wrangler.toml
        run: |
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_ID}/" wrangler.toml
          if grep -q REPLACE_WITH wrangler.toml; then echo "::error::wrangler.toml still has placeholders"; exit 1; fi

      - name: Deploy
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1)"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Set Worker secrets
        env:
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          for name in EBAY_CLIENT_SECRET EBAY_VERIFICATION_TOKEN GOOGLE_PLAY_SERVICE_ACCOUNT; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" > /dev/null
              echo "$name set."
            fi
          done
          echo "Secrets set."

      - name: Health check
        run: |
          if [ -z "$WORKER_URL" ]; then echo "::warning::Worker URL not found in the deploy output"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WORKER_URL/health" | grep -q '"ok":true'; then
              echo "### Worker online: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
              echo "Endpoint eBay Marketplace Account Deletion: $WORKER_URL/ebay/account-deletion" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WORKER_URL/health did not answer"
          exit 1
